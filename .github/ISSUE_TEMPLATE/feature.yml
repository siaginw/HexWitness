name: Feature request
description: Propose a generic evidence, adapter, daemon, or MCP improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What investigation becomes difficult without this feature?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence contract
      description: What generic fields, provenance, and privacy boundaries are required?
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This can be implemented without committing proprietary binary data or vendor database files.
          required: true
