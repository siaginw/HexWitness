<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">HexWitness</title>
  <desc id="desc">Make every byte testify. Evidence-first reverse engineering for humans and AI agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050b14"/>
      <stop offset="0.56" stop-color="#0c1728"/>
      <stop offset="1" stop-color="#17112c"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0v32" fill="none" stroke="#93c5fd" stroke-opacity=".07"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="360" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="28" fill="url(#grid)"/>
  <g transform="translate(76 44)">
    <path d="M136 0 254 68v136l-118 68L18 204V68z" fill="#081321" stroke="url(#accent)" stroke-width="7"/>
    <path d="M43 136c25-40 56-60 93-60s68 20 93 60c-25 40-56 60-93 60s-68-20-93-60Z" fill="#0d1b2e" stroke="#dffaff" stroke-width="6"/>
    <circle cx="136" cy="136" r="32" fill="url(#accent)" filter="url(#glow)"/>
    <circle cx="136" cy="136" r="12" fill="#07111f"/>
    <g fill="#67e8f9"><circle cx="18" cy="68" r="6"/><circle cx="254" cy="68" r="6"/><circle cx="18" cy="204" r="6"/><circle cx="254" cy="204" r="6"/></g>
  </g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="390" y="142" fill="#f8fafc" font-size="73" font-weight="750" letter-spacing="7">HEXWITNESS</text>
    <text x="394" y="194" fill="#8be9f7" font-size="25" font-weight="650" letter-spacing="4">MAKE EVERY BYTE TESTIFY</text>
    <text x="394" y="247" fill="#aebbd0" font-size="22">Evidence-first reverse engineering for humans and AI agents.</text>
  </g>
</svg>
