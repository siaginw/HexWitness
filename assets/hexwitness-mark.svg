<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">HexWitness mark</title>
  <desc id="desc">A luminous eye inside a technical hexagon.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="256" height="256" rx="44" fill="url(#bg)"/>
  <path d="M128 25 217 76v104l-89 51-89-51V76z" fill="none" stroke="url(#line)" stroke-width="8"/>
  <path d="M57 128c19-30 42-45 71-45s52 15 71 45c-19 30-42 45-71 45s-52-15-71-45Z" fill="#0b1728" stroke="#d8f7ff" stroke-width="6"/>
  <circle cx="128" cy="128" r="25" fill="url(#line)" filter="url(#glow)"/>
  <circle cx="128" cy="128" r="9" fill="#07111f"/>
  <g fill="#67e8f9">
    <circle cx="39" cy="76" r="6"/><circle cx="217" cy="76" r="6"/>
    <circle cx="39" cy="180" r="6"/><circle cx="217" cy="180" r="6"/>
  </g>
</svg>
