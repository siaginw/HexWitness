interface:
  display_name: "HexWitness"
  short_description: "Run evidence-first reverse-engineering investigations"
  default_prompt: "Use $hexwitness to resume or create a build-bound investigation, reuse retained evidence and failed attempts, challenge claims before completion, and escalate only one proven gap to a bounded local or live tool."
dependencies:
  tools:
    - type: "mcp"
      value: "hexwitness"
      description: "HexWitness durable reverse-engineering evidence and memory server"
policy:
  allow_implicit_invocation: true
